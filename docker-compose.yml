
services:
    feathers:
        container_name: feathers
        build: .
        ports:
            - 3030:3030
            - 9229:9229
        env_file:
            - .env.docker
        command: "pm2-runtime start ecosystem.config.js"       
        volumes:
            - ./:/usr/src/app        
            #- ~/.aws:~/.aws
        #entrypoint: sh -c "npm run migrate"
        #entrypoint: sh -c "npm run rollback"
        networks:
            - local
        extra_hosts:
            - "host.docker.internal:host-gateway"       
        #tty: true    
    redis:
        container_name: redis
        image: 'redis:latest'
        ports:
            - '6380:6379'
        networks:
            - local

networks:
  local:
