#      run:
#        npx prettier --write "{staged_files}" # --check prevents a commit from being created. --write applies Prettier changes, but leaves them out of the new commit.
#        # Ensure to manually amend the commit with the Prettier changes before creating another commit.
#    lint:
#      glob: '**/*.{ts,tsx}'
#      run: npx eslint "{staged_files}"

fix-styles:
  commands:
    style:
      glob: '**/*.{ts,tsx}'
      run: npx prettier --write "{staged_files}"
    lint:
      glob: '**/*.{ts,tsx}'
      run: npx eslint --fix "{staged_files}"
